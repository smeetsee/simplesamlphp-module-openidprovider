name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax-php:
    name: Syntax check PHP (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: php -l **/*.php

  syntax-yaml:
    name: Syntax check YAML
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Check YAML syntax
        run: yamllint -d relaxed .

  syntax-xml:
    name: Syntax check XML
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Check XML syntax
        run: find . -name '*.xml' -not -path '*/vendor/*' | xargs xmllint --noout

  syntax-json:
    name: Syntax check JSON
    runs-on: ubuntu-slim
    steps:
       - name: Checkout
         uses: actions/checkout@v7

       - name: Check JSON syntax
         run: find . -name '*.json' -not -path '*/vendor/*' | xargs jq . > /dev/null

  tests:
    name: PHPUnit (PHP ${{ matrix.php-version }}, composer ${{ matrix.command }})
    runs-on: ubuntu-latest
    needs:
       - syntax-php
       - syntax-yaml
       - syntax-xml
       - syntax-json
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        command: ['install', 'update']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer ${{ matrix.command }} --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: php vendor/bin/phpunit --no-coverage

  security-check:
    name: Security check
    runs-on: ubuntu-latest
    needs: tests
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: symfonycorp/security-checker-action@v5

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer

      - name: Install dependencies
        run: |
          composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests and collect coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    needs: tests
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Psalm
        uses: ./.github/actions/psalm

  phpcs:
    name: PHP Codesniffer
    runs-on: ubuntu-latest
    needs: tests
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs
